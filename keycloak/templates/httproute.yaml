{{- /*
Keycloak HTTPRoute (Gateway API) — alternative to Ingress
*/}}
{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "keycloak.fullname" . }}
  namespace: {{ include "keycloak.namespace" . | quote }}
  labels: {{- include "keycloak.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
    {{- with .Values.httpRoute.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if or .Values.httpRoute.annotations .Values.commonAnnotations }}
  annotations:
    {{- with .Values.httpRoute.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  parentRefs:
    {{- if .Values.httpRoute.parentRefs }}
    {{- include "keycloak.render" (dict "value" .Values.httpRoute.parentRefs "context" $) | nindent 4 }}
    {{- else }}
    - name: gateway
      namespace: {{ include "keycloak.namespace" . | quote }}
    {{- end }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames: {{- include "keycloak.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.httpRoute.blockedPaths }}
    - matches:
        - path:
            type: RegularExpression
            value: {{ . | quote }}
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: {{ printf "%s-deny" (include "keycloak.fullname" $) }}
    {{- end }}
    - backendRefs:
        - name: {{ include "keycloak.fullname" . }}
          port: {{ .Values.httpRoute.servicePort | default .Values.service.ports.http }}
          weight: 1
      {{- with .Values.httpRoute.matches }}
      matches: {{- include "keycloak.render" (dict "value" . "context" $) | nindent 8 }}
      {{- end }}
      {{- with .Values.httpRoute.filters }}
      filters: {{- include "keycloak.render" (dict "value" . "context" $) | nindent 8 }}
      {{- end }}
      {{- with .Values.httpRoute.timeouts }}
      timeouts: {{- include "keycloak.render" (dict "value" . "context" $) | nindent 8 }}
      {{- end }}
    {{- with .Values.httpRoute.extraRules }}
    {{- include "keycloak.render" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
{{- end }}
