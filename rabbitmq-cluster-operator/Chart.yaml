apiVersion: v2
name: rabbitmq-cluster-operator
description: >-
  Helm chart for the RabbitMQ Cluster Operator.
  Wraps the official upstream manifests from
  https://github.com/rabbitmq/cluster-operator.
  Requires cert-manager (admission webhook certificates) and
  RabbitMQ 4.2.4 or later (HTTP startup probe) since v2.22.0.
type: application
version: 0.3.0
appVersion: "v2.23.2"
home: https://github.com/rabbitmq/cluster-operator
sources:
  - https://github.com/rabbitmq/cluster-operator
maintainers:
  - name: devopsworks
    email: support@devops.works
